<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adotei Por Amor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-heart-pulse"></i>
            <span>Adotei Por Amor</span>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu de navegação">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-links" id="navLinks">
            <button class="nav-btn active" data-screen="home">
                Início
            </button>

            <button class="nav-btn" data-screen="listagem">
                Adotar
            </button>

            <button class="nav-btn" data-screen="cadastro_pet">
                Cadastrar Animal
            </button>

            <button class="nav-btn" data-screen="cadastro">
                Meu Cadastro
            </button>

            <button class="nav-btn" data-screen="perfil">
                Meu Perfil
            </button>
        </nav>
    </header>

    <main class="container" id="app"></main>

    <footer class="footer">
        <p>&copy; 2026 Adotei Por Amor - Sistemas de Informação</p>
    </footer>

    <script type="module" src="/main.js"></script>

</body>
</html>
